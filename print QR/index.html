<html lang="en">
<head>

        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        
        :root {
            --primary-bg: #0f172a;
            --accent-color: #f59e0b;
            --text-main: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            max-width: 800px;
        }
        
        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            letter-spacing: -0.01em;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .controls-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
        }
        
        .search-box {
            flex: 1;
            min-width: 280px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            padding: 12px 20px;
            border-radius: 30px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
        }
        
        .action-btns {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 25px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-primary {
            background: var(--accent-color);
            color: #000;
            border: none;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            filter: brightness(1.1);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid var(--glass-border);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-color);
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }
        
        .card-preview {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .card-preview:hover {
            transform: translateY(-5px);
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        
        .preview-title-top {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--accent-color);
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        
        .preview-qr-wrapper {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .preview-qr {
            width: 140px;
            height: 140px;
            display: block;
        }
        
        .preview-title-bottom {
            font-size: 16px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 25px;
            line-height: 1.4;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .print-single-btn {
            width: 100%;
            background: rgba(245, 158, 11, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(245, 158, 11, 0.25);
            padding: 10px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .print-single-btn:hover {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }
        
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 1.2rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: none;
        }
    </style>
</head>

        function printCard(title, qrImage) {
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>Print QR - ${title}</title>
                    <style>
                        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');
                        body {
                            margin: 0;
                            padding: 0;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            height: 100vh;
                            background: white;
                            font-family: 'Outfit', sans-serif;
                        }
                        .card {
                            border: 4px solid #000;
                            width: 4.5in;
                            height: 6.5in;
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            padding: 0.3in 0.4in 0.25in 0.4in;
                            box-sizing: border-box;
                            text-align: center;
                        }
                        .card-title-top {
                            font-size: 32px;
                            font-weight: 700;
                            letter-spacing: 0.1em;
                            color: #000;
                            border-bottom: 2px solid #000;
                            width: 100%;
                            padding-bottom: 8px;
                            margin-bottom: 10px;
                        }
                        .card-qr-container {
                            flex-grow: 1;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            margin: 15px 0;
                        }
                        .card-qr {
                            width: 3.6in;
                            height: 3.6in;
                        }
                        .card-title-bottom {
                            font-size: 22px;
                            font-weight: 600;
                            color: #000;
                            margin-top: auto;
                            margin-bottom: 0px;
                            word-wrap: break-word;
                            width: 100%;
                            line-height: 1.3;
                        }
                    </style>
                </head>
                <body>
                    <div class="card">
                        <div class="card-title-top">VIRASAT</div>
                        <div class="card-qr-container">
                            <img class="card-qr" src="../${qrImage}" alt="QR Code">
                        </div>
                        <div class="card-title-bottom">${title}</div>
                    </div>
                    <script>
                        window.onload = function() {
                            window.print();
                            setTimeout(function() { window.close(); }, 500);
                        }
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }
        
        function renderCards(cardsToRender) {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            
            cardsToRender.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card-preview';
                card.innerHTML = `
                    <div class="preview-title-top">VIRASAT</div>
                    <div class="preview-qr-wrapper">
                        <img class="preview-qr" src="${item.qr_image}" alt="QR Code">
                    </div>
                    <div class="preview-title-bottom">${item.title}</div>
                    <button class="print-single-btn" onclick="printCard('${item.title.replace(/'/g, "\\'")}', '${item.qr_image}')">Print Label</button>
                `;
                grid.appendChild(card);
            });
            
            const noResults = document.getElementById('noResults');
            noResults.style.display = cardsToRender.length === 0 ? 'block' : 'none';
        }
        
        function filterCards() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(item => item.title.toLowerCase().includes(query) || item.filename.toLowerCase().includes(query));
            renderCards(filtered);
        }
        
        // Initial render
        renderCards(items);
    </script>
